<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Sida 2</title>

<body>

    <h1 style="text-align: center;">Registration</h1>

   <html>

<head>
    <title>Registrering</title>
</head>

<body>

    

    <hr>

    <form style="text-align: center;" >

        <label>Namn:</label>
        <input type="text" name="namn" />
        
        <br><br>

        <label>E-post:</label>
        <input type="email" name="email" />

        <br><br>

        <label>Ålder:</label>
        <input type="number" name="age" min="1" max="100" />

        <br><br>

        <label>Lösenord:</label>
        <input type="password" name="losenord" />

        <br><br>

        <p>Gender:</p>

        <input type="radio" name="gender" value="man" />
        <label>Man</label>

        <input type="radio" name="gender" value="kvinna" />
        <label>Kvinna</label>

        <br><br>

        <p>Courses:</p>

        <input type="checkbox" name="course" value="html" />
        <label>HTML</label>

        <br>

        <input type="checkbox" name="course" value="css" />
        <label>CSS</label>

        <br>

        <input type="checkbox" name="course" value="javascript" />
        <label>JavaScript</label>

        <br><br>

        <label>Land:</label>

        <select name="land">
            <option value="sverige">Sverige</option>
            <option value="danmark">Danmark</option>
            <option value="norge">Norge</option>
        </select>

        <br><br>

        <input type="submit" value="Registrera" />

        <input type="reset" value="Rensa" />

    </form>

</body>

</html>
