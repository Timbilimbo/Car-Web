<!DOCTYPE html>
<html>
<head>
    <title>Studentformulär</title>
</head>
<body>

    <h1>Studentformulär</h1>

    <form>

        <label>Namn:</label>
        <br>
        <input type="text" name="namn"><br><br>


        <label>Email:</label>
        <br>
        <input type="email" name="email"><br><br>


        <label>Favoritämne:</label><br>
        <select name="favoritamne">
            <option>Matematik</option>
            <option>Programmering</option>
            <option>Engelska</option>
            <option>Svenska</option>
            <option>Fysik</option>
        </select>

        <br><br>


        <label>Hobbyer:</label><br>

        <input type="checkbox" name="hobby" value="gaming">
        Gaming<br>

        <input type="checkbox" name="hobby" value="pingis">
        Pingis<br>

        <input type="checkbox" name="hobby" value="gym">
        Gym<br><br>


       
        <label>Tycker du om skolan?</label><br>

        <input type="radio" name="skola" value="ja">
        Ja

        <input type="radio" name="skola" value="nej">
        Nej

        <br><br>


       
        <label>Skriv ett meddelande:</label><br>
        <textarea name="meddelande" rows="5" cols="30"></textarea>

        <br><br>


        <input type="submit" value="Skicka">
        <input type="reset" value="Rensa">

    </form>

    <br>

    <a href="index.html">
        <button>
            Tillbaka till startsidan

        </button>
    </a>

</body>
</html>
