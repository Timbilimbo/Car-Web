<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

<form name="frmname">
   <p style="text-align: center; padding: 10px;">Välj betalningsmetod
<br>
    <input type="radio" name="Rdoname" value="dc" onchange="Rdofun()">
    <label for="dc">Debit Card</label>

    <input type="radio" name="Rdoname" value="cc"onchange="Rdofun()">
    <label for="cc">Credit Card</label>

    <input type="radio" name="Rdoname" value="Bt" onchange="Rdofun()">
    <label for="Bt">Bank Transfer</label>
</p>
</form>
<h2 style="text-align: center;" id="res"></h2>
<script type="text/javascript">
    function Rdofun(){
        let bankval=frmname.Rdoname.value;
        if (bankval=="dc")
        document.getElementById("res").innerHTML = "Du har valt Debit Card ";

        if (bankval=="cc")
        document.getElementById("res").innerHTML = "Du har valt Credit Card ";

        if (bankval=="Bt")
        document.getElementById("res").innerHTML = "Du har valt Bank Transfer ";
    
    }
</script>


</body>
</html>
